<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"></head><body>
<script>
'use strict';
const parentOrigin=<?!= originJson ?>,channel=<?!= channelJson ?>;
const send=(type,extra={})=>window.top.postMessage({type,channel,...extra},parentOrigin);
window.addEventListener('message',event=>{
 if(event.source!==window.top||event.origin!==parentOrigin||event.data?.channel!==channel)return;
 if(event.data.type==='revive:ping'){send('revive:ready');return;}
 if(event.data.type!=='revive:request')return;
 const {request,messageId}=event.data;
 google.script.run.withSuccessHandler(result=>send('revive:response',{messageId,result}))
  .withFailureHandler(error=>send('revive:response',{messageId,result:{ok:false,uncertain:true,error:error.message||'Google Sheets service error.'}})).reviveRpc(request);
});
send('revive:ready');
</script></body></html>
