   if(!/^https:\/\/(?:script|[a-z0-9-]+-script)\.googleusercontent\.com$/.test(event.origin))return;

  });

</script><script>(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const state={session:null,settings:null,draft:null,receipts:new Map(),products:[],stream:null,cameraKind:null,facing:'user',pending:new Map(),busy:0};
const bridge=new SheetsBridge((window.REVIVE_CONFIG?.SHEETS_API_URL||'').trim());
let viewSeq=0,toastTimer,returnTo='/dashboard';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const fyFor=date=>{const y=Number(date.slice(0,4)),s=Number(date.slice(5,7))>=4?y:y-1;return `${s}-${s+1}`;};
const periods=fy=>Array.from({length:12},(_,i)=>{const year=Number(fy.slice(0,4))+(i>=9?1:0);return `${year}-${String((i+3)%12+1).padStart(2,'0')}`;});
const monthLabel=p=>new Date(p+'-01T12:00:00Z').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const dateLabel=d=>d?new Date(d.length===10?d+'T12:00:00Z':d).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric'}):'—';
const age=dob=>{const t=today();return Number(t.slice(0,4))-Number(dob.slice(0,4))-(t.slice(5)<dob.slice(5)?1:0);};
function tell(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);}
function connection(message,ok=false){$('#connection-text').textContent=message;$('#connection-dot').classList.toggle('live',ok);}
async function call(action,payload={},extra={}){if(navigator.onLine===false)throw new Error('You are offline. Reconnect to read or save studio records.');const result=await bridge.call({apiVersion:4,action,payload,token:state.session?.token||'',...extra});if(!result?.ok){const error=new Error(result?.error||'The server did not accept this request.');error.uncertain=result?.uncertain===true;throw error;}connection('Live · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),true);return result.data;}
async function save(action,payload,scope){let task=state.pending.get(scope);const json=JSON.stringify(payload);if(task&&task.json!==json)throw new Error('A previous save is unconfirmed. Retry its original details before changing this form.');if(!task){task={requestId:crypto.randomUUID(),statusSecret:crypto.randomUUID(),json};state.pending.set(scope,task);}
 state.busy++;connection('Saving to Google Sheets…');try{const data=await call(action,payload,task);state.pending.delete(scope);return data;}catch(e){
  if(e.uncertain){try{const status=await call('requestStatus',{requestId:task.requestId,statusSecret:task.statusSecret});if(status.found){state.pending.delete(scope);if(!status.response.ok)throw new Error(status.response.error);return status.response.data;}}catch{}
   throw new Error('Save not confirmed. Keep this page open and retry the same details. The same request will not create a duplicate.');
  }
  state.pending.delete(scope);throw e;
 }finally{state.busy--;}}
function stopCamera(){state.stream?.getTracks().forEach(t=>t.stop());state.stream=null;}
function route(){const raw=location.hash.replace(/^#/,'')||'/home';const [path,q='']=raw.split('?');return {path:decodeURI(path),params:new URLSearchParams(q)};}
function go(path,replace=false){if(location.hash==='#'+path){render();return;}const depth=Number(history.state?.depth||0)+(replace?0:1);history[replace?'replaceState':'pushState']({depth},'','#'+path);render();}
function back(){if(state.busy){tell('Wait for the current save to finish.');return;}if(history.state?.depth>0)history.back();else go('/home',true);}
function needSession(path,admin=false){if(!state.session||(admin&&state.session.user.role!=='admin')){returnTo=path;go(admin?'/admin':'/staff',true);return false;}return true;}
function page(title,body,bind=()=>{}){return {title,body,bind};}
function note(text,kind=''){return `<div class="notice ${kind}" role="status">${esc(text)}</div>`;}
function btn(label,routeName,cls='secondary'){return `<a href="#${routeName}" class="${cls}" data-route="${routeName}">${esc(label)}</a>`;}
function input(label,name,value='',type='text',attrs='',optional=false){return `<div class="field"><label for="${name}">${esc(label)}${optional?'':' <span class="required">*</span>'}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs} ${optional?'':'required'}></div>`;}
function select(label,name,options,value){return `<div class="field"><label for="${name}">${esc(label)}</label><select id="${name}" name="${name}">${options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`;}).join('')}</select></div>`;}
function fySelect(value=fyFor(today()),name='fy'){const current=Number(fyFor(today()).slice(0,4)),selected=Number(value.slice(0,4));const years=new Set([selected,...Array.from({length:9},(_,i)=>current-6+i)]);return select('Financial year',name,[...years].sort().reverse().map(y=>`${y}-${y+1}`),value);}
function formError(form,error){let box=form.querySelector('.form-error');if(!box){box=document.createElement('div');box.className='notice error form-error';box.setAttribute('role','alert');form.prepend(box);}box.textContent=error.message;box.scrollIntoView({block:'nearest'});}
function submit(id,handler){const form=$(id);if(!form)return;form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const b=form.querySelector('[type="submit"]');const text=b?.textContent;if(b){b.disabled=true;b.textContent='Please wait…';}form.querySelector('.form-error')?.remove();try{await handler(Object.fromEntries(new FormData(form)),form);}catch(error){formError(form,error);}finally{if(b&&b.isConnected){b.disabled=false;b.textContent=text;}}});}
function table(headers,rows){return rows.length?`<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="empty-state">No records for this selection.</p>';}
function summary(pairs){return `<div class="summary">${pairs.map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`;}
function paymentFields(amount,allowPartial=false){return `<div class="form-grid">${allowPartial?input('Amount received (₹)','amount',amount,'number',`min="0.01" max="${amount}" step="0.01"`):''}${select('Payment method','mode',[['CASH','Cash'],['UPI','UPI']],'CASH')}${input('UPI reference (optional)','reference','','text','maxlength="80"',true)}${input('Collecting staff / admin PIN','collectorPin','','password','inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="off"')}</div><div id="upi-box" hidden><div id="upi-qr"></div><p id="upi-info" class="helper"></p><a id="upi-pay" class="secondary" href="#">Open UPI app</a></div><label class="check"><input name="paymentConfirmed" type="checkbox" required> I have confirmed receipt of this payment in cash or the studio bank account.</label>`;}
function wireUpi(form,amount){const update=()=>{const box=$('#upi-box');if(!box)return;box.hidden=form.elements.mode.value!=='UPI';if(box.hidden)return;const upi=state.settings?.upiId,amt=typeof amount==='function'?amount():amount;$('#upi-qr').replaceChildren();if(!upi){$('#upi-info').textContent='The admin needs to configure the studio UPI account before collecting UPI payments.';$('#upi-pay').hidden=true;return;}const url='upi://pay?'+new URLSearchParams({pa:upi,pn:state.settings.studioName||'Revive Fitness Studio',am:String(amt),cu:'INR'}).toString();$('#upi-info').textContent=`${upi} · ${money(amt)}. The QR does not verify payment automatically.`;$('#upi-pay').href=url;$('#upi-pay').hidden=false;if(typeof qrcode==='function'){const qr=qrcode(0,'M');qr.addData(url);qr.make();$('#upi-qr').innerHTML=qr.createSvgTag({cellSize:4,margin:8,scalable:true});}};form.elements.mode.addEventListener('change',update);form.elements.amount?.addEventListener('input',update);update();}
function paymentPayload(f){if(f.mode==='UPI'&&!state.settings?.upiId)throw new Error('Configure the studio UPI ID first.');return {mode:f.mode,reference:f.reference||'',collectorPin:f.collectorPin,paymentConfirmed:f.paymentConfirmed==='on'};}
function keepReceipt(result){const receipt=result.receipt;state.receipts.set(receipt.id,receipt);go('/receipt/'+encodeURIComponent(receipt.id));}
async function loginPage(role){return page(role==='admin'?'Admin login':'Staff login',`<p class="intro">Enter your studio PIN to access your workspace.</p><form id="login-form">${input('PIN','pin','','password','inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="current-password"')}<button class="primary" type="submit">Sign in</button></form>`,()=>submit('#login-form',async f=>{state.session=await call('login',{role,pin:f.pin});tell('Signed in as '+state.session.user.name);go(returnTo||'/dashboard',true);returnTo='/dashboard';}));}
async function dashboard(){return page('Studio workspace',`<div class="section-heading"><p>Welcome, <strong>${esc(state.session.user.name)}</strong></p><button class="text-button" id="logout">Sign out</button></div><div class="workspace-grid">${[['Admission registration','/admission/details'],['Daily attendance','/attendance'],['Fee collection','/members?mode=fee'],['Member details','/members'],['Supplement store','/store'],...(state.session.user.role==='admin'?[['Expense entry','/expenses'],['Reports & cash P&L','/reports'],['Tariffs & promotions','/tariffs'],['UPI & studio settings','/settings'],['Staff access','/staff-access'],['Store inventory','/products']]:[]),['Change my PIN','/pins']].map(([label,path])=>btn(label,path,'workspace-link')).join('')}</div>`,()=>$('#logout').onclick=async()=>{try{await call('logout');}catch{}state.session=null;state.draft=null;state.receipts.clear();go('/home',true);});}
function emptyDraft(){return {date:today(),admissionCategory:'Individual',trainingCategory:'Regular',firstName:'',lastName:'',primaryContact:'',alternateContact:'',dob:'',address:'',photo:'',signature:'',previousId:''};}
async function admissionDetails(){state.draft??=emptyDraft();const d=state.draft;return page(d.previousId?'Readmission details':'Admission registration',`<p class="step-label">STEP 1 OF 3 · MEMBER DETAILS</p><div class="actions">${btn('Validate a previous membership','/readmission')}</div>${d.previousId?note('Readmission linked to '+d.previousId):''}<form id="admission-details"><div class="form-grid">${input('Admission date','date',d.date,'date',`max="${today()}"`)}${select('Admission category','admissionCategory',['Individual','Family'],d.admissionCategory)}${select('Training category','trainingCategory',['Regular','Personal Training'],d.trainingCategory)}${input('First name','firstName',d.firstName,'text','maxlength="60" autocomplete="given-name"')}${input('Last name (optional)','lastName',d.lastName,'text','maxlength="60" autocomplete="family-name"',true)}${input('Primary phone','primaryContact',d.primaryContact,'tel','inputmode="numeric" pattern="[0-9]{10}" maxlength="10"')}${input('Alternate phone (optional)','alternateContact',d.alternateContact,'tel','inputmode="numeric" pattern="[0-9]{10}" maxlength="10"',true)}${input('Date of birth','dob',d.dob,'date',`max="${today()}"`)}<div class="field"><label>Age</label><output id="age">${d.dob?age(d.dob):'—'}</output></div><div class="field full"><label for="address">Residential address *</label><textarea id="address" name="address" maxlength="400" required>${esc(d.address)}</textarea></div></div><p class="helper">Individual memberships require a unique phone. Family members may share a family phone.</p><button class="primary" type="submit">Continue to photo & signature</button></form>`,()=>{$('#dob').onchange=e=>$('#age').textContent=age(e.target.value);submit('#admission-details',async f=>{state.draft={...d,...f};go('/admission/verify');});});}
async function readmissionPage(){return page('Validate readmission',`<p class="intro">Search the latest previous membership. The server checks the configured six-month rule.</p><form id="readmission-search">${input('Phone or admission ID','query','','search')}<button class="primary" type="submit">Find membership</button></form><div id="readmission-results"></div>`,()=>submit('#readmission-search',async f=>{const rows=await call('searchMembers',{query:f.query,includeArchived:true});$('#readmission-results').innerHTML=rows.map(m=>`<button class="result-row" data-readmit="${esc(m.id)}"><strong>${esc(m.fullName)}</strong><small>${esc(m.id)} · ${dateLabel(m.date)} · ${esc(m.status)}</small></button>`).join('')||note('No membership found.');$$('[data-readmit]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await call('member',{id:b.dataset.readmit});if(!r.readmission.eligible)throw new Error('Continue the existing membership. Readmission becomes eligible on '+dateLabel(r.readmission.eligibleOn)+'.');if(r.member.status==='Readmitted')throw new Error('Select the newer membership linked to this member.');state.draft={...r.member,date:today(),previousId:r.member.id};go('/admission/details');}catch(e){tell(e.message);b.disabled=false;}});}));}
async function compressImage(file,maxWidth=700){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error('Choose a JPG, PNG or WebP image.');if(file.size>15*1024*1024)throw new Error('Choose an image smaller than 15 MB.');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();let width=Math.min(maxWidth,image.naturalWidth),quality=.82,result;do{const canvas=document.createElement('canvas');canvas.width=width;canvas.height=Math.round(image.naturalHeight*width/image.naturalWidth);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);result=canvas.toDataURL('image/jpeg',quality);quality-=.12;width=Math.round(width*.85);}while(result.length>220000&&width>100);if(result.length>220000)throw new Error('Image is too large. Choose a smaller image.');return result;}finally{URL.revokeObjectURL(url);}}
async function verificationPage(){if(!state.draft){go('/admission/details',true);return;}const d=state.draft;return page('Photo & signature',`<p class="step-label">STEP 2 OF 3 · MEMBER VERIFICATION</p><div class="capture-grid">${['photo','signature'].map(kind=>`<section class="capture-card"><h3>${kind==='photo'?'Member photo':'Member signature'}</h3><img class="capture-preview" id="${kind}-preview" src="${d[kind]||''}" alt="${kind==='photo'?'Member photo':'Uploaded signature'}" ${d[kind]?'':'hidden'}><p class="helper">${kind==='photo'?'Capture a clear portrait.':'Photograph a signature written on plain white paper.'}</p><button class="secondary" data-camera="${kind}" type="button">Open camera</button><label class="file-button">Upload image<input type="file" id="${kind}-file" accept="image/jpeg,image/png,image/webp"></label></section>`).join('')}</div><div id="camera-panel" hidden><video id="camera-video" autoplay playsinline muted></video><div class="actions"><button class="primary" id="camera-capture" type="button">Capture</button><button class="secondary" id="camera-switch" type="button">Switch camera</button><button class="secondary" id="camera-close" type="button">Close camera</button></div></div><form id="verification-next"><button class="primary" type="submit">Continue to fee summary</button></form>`,()=>{
 const setImage=(kind,data)=>{state.draft[kind]=data;const img=$('#'+kind+'-preview');img.src=data;img.hidden=false;};
 ['photo','signature'].forEach(kind=>$('#'+kind+'-file').onchange=async e=>{try{if(e.target.files[0])setImage(kind,await compressImage(e.target.files[0],kind==='photo'?700:900));}catch(err){tell(err.message);}});
 async function start(kind){stopCamera();state.cameraKind=kind;try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing}},audio:false});if(route().path!=='/admission/verify'){stream.getTracks().forEach(t=>t.stop());return;}state.stream=stream;$('#camera-panel').hidden=false;$('#camera-video').srcObject=stream;await $('#camera-video').play();$('#camera-panel').scrollIntoView({block:'center'});}catch(e){tell('Camera unavailable. Allow camera access or upload a photo.');}}
 $$('[data-camera]').forEach(b=>b.onclick=()=>{state.facing=b.dataset.camera==='signature'?'environment':'user';start(b.dataset.camera);});
 $('#camera-switch').onclick=()=>{state.facing=state.facing==='user'?'environment':'user';start(state.cameraKind);};$('#camera-close').onclick=()=>{stopCamera();$('#camera-panel').hidden=true;};
 $('#camera-capture').onclick=()=>{const v=$('#camera-video');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(async blob=>{try{setImage(state.cameraKind,await compressImage(blob));stopCamera();$('#camera-panel').hidden=true;}catch(e){tell(e.message);}},'image/jpeg',.9);};
 submit('#verification-next',async()=>{if(!d.photo||!d.signature)throw new Error('Capture or upload both the member photo and signature.');go('/admission/payment');});
 });}
async function admissionPayment(){const d=state.draft;if(!d?.photo||!d.signature){go('/admission/details',true);return;}const q=await call('quoteAdmission',{...d,photo:undefined,signature:undefined});return page('Admission payment',`<p class="step-label">STEP 3 OF 3 · PAYMENT & REGISTRATION</p>${summary([['Member',[d.firstName,d.lastName].filter(Boolean).join(' ')],['Admission ID','Assigned by the sheet after saving'],['Admission fee',money(q.admissionFee)],['First month training',money(q.trainingFee)],['Total received',money(q.total)]])}${q.promoName?note('Promotion: '+q.promoName):''}${q.prorated?note('First month prorated for '+q.remainingDays+' remaining days using the studio’s 30-day rule.'):''}<details><summary>Studio rules and declaration</summary><div class="rules"><h3>Studio rules / നിബന്ധനകൾ</h3><ol>
                    <li><strong>Members must strictly observe discipline.</strong><em>അംഗങ്ങൾ കർശനമായി അച്ചടക്കം പാലിക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Fees must be paid on time. The fee for each month must be paid before the 9th of that month.</strong><em>ഫീസ് കൃത്യസമയത്ത് അടയ്ക്കേണ്ടതാണ്. എല്ലാ മാസവും 9-ാം തീയതിക്ക് മുമ്പായി അതാത് മാസത്തെ ഫീസ് അടയ്ക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Equipment must be returned to its proper place after use.</strong><em>ക്ലബ്ബിലെ ഉപകരണങ്ങൾ ഉപയോഗിച്ചതിനുശേഷം യഥാസ്ഥാനങ്ങളിൽ തിരികെ വയ്ക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Advance fees and monthly fees once paid will not be refunded.</strong><em>ഒരിക്കൽ അടച്ച അഡ്വാൻസ് ഫീസും മാസഫീസും മടക്കിത്തരുന്നതല്ല.</em></li>
                    <li><strong>Belongings brought to the club must be kept at one's own risk.</strong><em>ക്ലബ്ബിൽ കൊണ്ടുവരുന്ന സാധനങ്ങൾ സ്വന്തം ഉത്തരവാദിത്വത്തിൽ സൂക്ഷിക്കേണ്ടതാണ്.</em></li>
                    <li><strong>The time of practice and name must be entered accurately in the club's register book every day.</strong><em>പ്രാക്ടീസിനായി വരുന്ന സമയവും പേരും എല്ലാ മാസവും ക്ലബ്ബിലെ രജിസ്റ്റർ ബുക്കിൽ കൃത്യമായി രേഖപ്പെടുത്തേണ്ടതാണ്.</em></li>
                    <li><strong>It is mandatory to use a towel during practice. Practice will not be allowed without a towel.</strong><em>നിർബന്ധമായും ടവ്വൽ ഉപയോഗിച്ച് പ്രാക്ടീസ് ചെയ്യുക. ടവ്വൽ ഇല്ലാത്തപക്ഷം പ്രാക്ടീസ് ചെയ്യാൻ അനുവദിക്കുന്നതല്ല.</em></li>
                    <li><strong>Workout using a t-shirt and track pants.</strong><em>ടീഷർട്ട്, ട്രാക്ക് പാന്റ് എന്നിവ ഉപയോഗിച്ച് വർക്കൗട്ട് ചെയ്യുക.</em></li>
                    <li><strong>If absent continuously for 6 months, readmission must be taken.</strong><em>തുടർച്ചയായി 6 മാസം വരാതിരുന്നാൽ തുടർന്ന് റീ അഡ്മിഷൻ എടുക്കേണ്ടി വരുന്നതാണ്.</em></li>
                    <li><strong>Do not enter the club under the influence of alcohol or drugs. If found, membership will be cancelled.</strong><em>ലഹരി കഴിച്ചുകൊണ്ട് ക്ലബ്ബിൽ പ്രവേശിക്കാൻ പാടില്ല. അങ്ങനെ കണ്ടെത്തിയാൽ അംഗത്വം റദ്ദ് ചെയ്യുന്നതായിരിക്കും.</em></li>
                    <li><strong>Management is not responsible for any accidents during training.</strong><em>പരിശീലനത്തിനിടയിൽ ഉണ്ടാകുന്ന അത്യാഹിതങ്ങൾക്ക് മാനേജ്മെന്റിന് യാതൊരു ഉത്തരവാദിത്വവും ഉണ്ടായിരിക്കുന്നതല്ല.</em></li>
                    <li><strong>Members are fully responsible for any damages caused to the club by them.</strong><em>അംഗങ്ങൾമൂലം ക്ലബ്ബിൽ ഉണ്ടാകുന്ന നാശനഷ്ടങ്ങളുടെ പൂർണ്ണ ഉത്തരവാദിത്വം അതത് അംഗങ്ങൾക്ക് തന്നെയായിരിക്കും.</em></li>
                    <li><strong>Those with any confirmed medical conditions must produce a full medical clearance certificate from a doctor.</strong><em>വൈദ്യശാസ്ത്രപരമായ ഏതെങ്കിലും രോഗം ഉള്ളതായി സ്ഥിരീകരിക്കപ്പെട്ടിട്ടുള്ളവർ ഡോക്ടറുടെ പൂർണ്ണ ആരോഗ്യ സർട്ടിഫിക്കറ്റ് ഹാജരാക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Ensure that all the above conditions are read, understood, and acceptable. Applicable to everyone.</strong><em>മേൽപ്പറഞ്ഞ നിബന്ധനകൾ എല്ലാം വായിച്ചു ബോധ്യപ്പെടുകയും അവയെല്ലാം സ്വീകാര്യവുമാണെന്ന് ഉറപ്പ് വരുത്തുക. മുകളിൽ പറഞ്ഞ വസ്തുതകൾ എല്ലാവർക്കും ബാധകം.</em></li>
                </ol></div></details><form id="admit-form"><label class="check"><input type="checkbox" name="consent" required> The member has read and accepted the studio rules and provided their photo and signature.</label>${paymentFields(q.total)}<button class="primary" type="submit">Confirm payment & register</button></form>`,()=>{wireUpi($('#admit-form'),q.total);submit('#admit-form',async f=>{const result=await save('admit',{...d,...paymentPayload(f),consent:f.consent==='on',expectedTotal:q.total},'admit');state.draft=null;keepReceipt(result);});});}
async function attendancePage(){const date=route().params.get('date')||today();let logs=[];if(state.session)logs=await call('attendanceLogs',{date});return page('Daily attendance',`<form id="attendance-search">${input(state.session?'Phone, admission ID or name':'Phone number or admission ID','query','','search','autocomplete="off"')}<button type="submit" class="primary">Find member</button></form><div id="attendance-results"></div><h3>Attendance logs</h3>${state.session?`<form id="attendance-filter">${input('Date','date',date,'date',`max="${today()}"`)}<button class="secondary" type="submit">View date</button></form>${table(['Member','Admission ID','Time'],logs.map(a=>[esc(a.name),esc(a.memberId),esc(a.time)]))}`:note('Staff can sign in to search by name and view attendance logs.')}`,()=>{
 submit('#attendance-search',async f=>{const rows=await call('lookupAttendance',{query:f.query});$('#attendance-results').innerHTML=rows.map(m=>`<div class="result-row"><div><strong>${esc(m.fullName)}</strong><small>${esc(m.id)} · ${esc(m.phone)}</small></div><button type="button" class="secondary" data-checkin="${esc(m.id)}" ${m.present?'disabled':''}>${m.present?'Already present':'Mark present'}</button></div>`).join('')||note('No active member found. Enter the complete phone number or admission ID.');$$('[data-checkin]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const result=await save('markAttendance',{memberId:b.dataset.checkin,identifier:f.query},'attendance:'+b.dataset.checkin);b.textContent=result.alreadyPresent?'Already present':'Marked present';tell('Attendance confirmed in Google Sheets.');}catch(e){tell(e.message);b.disabled=false;}});});

                    <li><strong>Members must strictly observe discipline.</strong><em>അംഗങ്ങൾ കർശനമായി അച്ചടക്കം പാലിക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Fees must be paid on time. The fee for each month must be paid before the 9th of that month.</strong><em>ഫീസ് കൃത്യസമയത്ത് അടയ്ക്കേണ്ടതാണ്. എല്ലാ മാസവും 9-ാം തീയതിക്ക് മുമ്പായി അതാത് മാസത്തെ ഫീസ് അടയ്ക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Equipment must be returned to its proper place after use.</strong><em>ക്ലബ്ബിലെ ഉപകരണങ്ങൾ ഉപയോഗിച്ചതിനുശേഷം യഥാസ്ഥാനങ്ങളിൽ തിരികെ വയ്ക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Advance fees and monthly fees once paid will not be refunded.</strong><em>ഒരിക്കൽ അടച്ച അഡ്വാൻസ് ഫീസും മാസഫീസും മടക്കിത്തരുന്നതല്ല.</em></li>
                    <li><strong>Belongings brought to the club must be kept at one's own risk.</strong><em>ക്ലബ്ബിൽ കൊണ്ടുവരുന്ന സാധനങ്ങൾ സ്വന്തം ഉത്തരവാദിത്വത്തിൽ സൂക്ഷിക്കേണ്ടതാണ്.</em></li>
                    <li><strong>The time of practice and name must be entered accurately in the club's register book every day.</strong><em>പ്രാക്ടീസിനായി വരുന്ന സമയവും പേരും എല്ലാ മാസവും ക്ലബ്ബിലെ രജിസ്റ്റർ ബുക്കിൽ കൃത്യമായി രേഖപ്പെടുത്തേണ്ടതാണ്.</em></li>
                    <li><strong>It is mandatory to use a towel during practice. Practice will not be allowed without a towel.</strong><em>നിർബന്ധമായും ടവ്വൽ ഉപയോഗിച്ച് പ്രാക്ടീസ് ചെയ്യുക. ടവ്വൽ ഇല്ലാത്തപക്ഷം പ്രാക്ടീസ് ചെയ്യാൻ അനുവദിക്കുന്നതല്ല.</em></li>
                    <li><strong>Workout using a t-shirt and track pants.</strong><em>ടീഷർട്ട്, ട്രാക്ക് പാന്റ് എന്നിവ ഉപയോഗിച്ച് വർക്കൗട്ട് ചെയ്യുക.</em></li>
                    <li><strong>If absent continuously for 6 months, readmission must be taken.</strong><em>തുടർച്ചയായി 6 മാസം വരാതിരുന്നാൽ തുടർന്ന് റീ അഡ്മിഷൻ എടുക്കേണ്ടി വരുന്നതാണ്.</em></li>
                    <li><strong>Do not enter the club under the influence of alcohol or drugs. If found, membership will be cancelled.</strong><em>ലഹരി കഴിച്ചുകൊണ്ട് ക്ലബ്ബിൽ പ്രവേശിക്കാൻ പാടില്ല. അങ്ങനെ കണ്ടെത്തിയാൽ അംഗത്വം റദ്ദ് ചെയ്യുന്നതായിരിക്കും.</em></li>
                    <li><strong>Management is not responsible for any accidents during training.</strong><em>പരിശീലനത്തിനിടയിൽ ഉണ്ടാകുന്ന അത്യാഹിതങ്ങൾക്ക് മാനേജ്മെന്റിന് യാതൊരു ഉത്തരവാദിത്വവും ഉണ്ടായിരിക്കുന്നതല്ല.</em></li>
                    <li><strong>Members are fully responsible for any damages caused to the club by them.</strong><em>അംഗങ്ങൾമൂലം ക്ലബ്ബിൽ ഉണ്ടാകുന്ന നാശനഷ്ടങ്ങളുടെ പൂർണ്ണ ഉത്തരവാദിത്വം അതത് അംഗങ്ങൾക്ക് തന്നെയായിരിക്കും.</em></li>
                    <li><strong>Those with any confirmed medical conditions must produce a full medical clearance certificate from a doctor.</strong><em>വൈദ്യശാസ്ത്രപരമായ ഏതെങ്കിലും രോഗം ഉള്ളതായി സ്ഥിരീകരിക്കപ്പെട്ടിട്ടുള്ളവർ ഡോക്ടറുടെ പൂർണ്ണ ആരോഗ്യ സർട്ടിഫിക്കറ്റ് ഹാജരാക്കേണ്ടതാണ്.</em></li>
                    <li><strong>Ensure that all the above conditions are read, understood, and acceptable. Applicable to everyone.</strong><em>മേൽപ്പറഞ്ഞ നിബന്ധനകൾ എല്ലാം വായിച്ചു ബോധ്യപ്പെടുകയും അവയെല്ലാം സ്വീകാര്യവുമാണെന്ന് ഉറപ്പ് വരുത്തുക. മുകളിൽ പറഞ്ഞ വസ്തുതകൾ എല്ലാവർക്കും ബാധകം.</em></li>
                </ol></div><p class="helper">${esc(state.settings?.address)} · ${esc(state.settings?.phone)}</p></article><div class="actions no-print"><button class="primary" id="download-pdf">Download PDF record</button><button class="secondary" id="print-record">Print / Save as PDF</button><button class="secondary" id="share-pdf">Share PDF</button><a class="secondary" id="whatsapp" target="_blank" rel="noopener">Prepare WhatsApp welcome</a></div>`,()=>wireDocument(m.id+'-Admission.pdf',`Welcome to Revive Fitness Studio, ${m.firstName}! Your admission is confirmed. Admission ID: ${m.id}.`,m.primaryContact));}
async function render(){const seq=++viewSeq;stopCamera();const {path,params}=route();const parts=path.split('/').filter(Boolean);$('#home-view').hidden=path!=='/home';$('#screen').hidden=path==='/home';document.body.dataset.page=path==='/home'?'home':'module';$('#workspace-link').hidden=!state.session;$('#back').hidden=path==='/home';$('#refresh').hidden=path==='/home';
 if(path==='/home'){document.title='Revive Fitness Studio | Portal';window.scrollTo(0,0);return;}
 $('#screen-title').textContent='Loading…';$('#screen-content').innerHTML='<p class="loading">Loading live records…</p>';
 const adminPaths=['/archive','/expenses','/reports','/tariffs','/promotions','/settings','/staff-access','/products'];
 const signedPaths=['/dashboard','/readmission','/members','/member','/edit','/pay','/record','/checkout','/pins',...adminPaths];
 const key='/'+parts[0];if(signedPaths.includes(key)&&!needSession(path+(location.hash.includes('?')?'?'+params.toString():''),adminPaths.includes(key)))return;
 try{let result;switch(key){case '/admission':result=parts[1]==='verify'?await verificationPage():parts[1]==='payment'?await admissionPayment():await admissionDetails();break;case '/staff':result=await loginPage('staff');break;case '/admin':result=await loginPage('admin');break;case '/dashboard':result=await dashboard();break;case '/readmission':result=await readmissionPage();break;case '/attendance':result=await attendancePage();break;case '/members':result=await membersPage();break;case '/member':result=await memberPage(parts[1]);break;case '/pay':result=await feePage(parts[1],parts[2]);break;case '/edit':result=await editPage(parts[1]);break;case '/archive':result=await archivePage(parts[1]);break;case '/expenses':result=await expensesPage();break;case '/reports':result=await reportsPage();break;case '/tariffs':result=await tariffsPage();break;case '/promotions':result=await promotionsPage();break;case '/settings':result=await settingsPage();break;case '/staff-access':result=await staffPage();break;case '/pins':result=await pinsPage();break;case '/store':result=await storePage();break;case '/checkout':result=await checkoutPage(parts[1]);break;case '/products':result=await productsPage();break;case '/receipt':result=await receiptPage(parts[1]);break;case '/record':result=await recordPage(parts[1]);break;default:go('/home',true);return;}
  if(seq!==viewSeq||!result)return;$('#screen-title').textContent=result.title;$('#screen-content').innerHTML=result.body;document.title=result.title+' | Revive';result.bind();window.scrollTo(0,0);$('#screen-title').focus({preventScroll:true});
 }catch(error){if(seq!==viewSeq)return;$('#screen-title').textContent='Unable to load';$('#screen-content').innerHTML=note(error.message,'error')+'<button class="primary" id="retry-view">Try again</button>';$('#retry-view').onclick=render;connection('Connection needs attention');}}
$('#year').textContent=new Date().getFullYear();$('#back').onclick=back;$('#refresh').onclick=()=>{if(!state.busy)render();};
document.addEventListener('click',e=>{const a=e.target.closest('[data-route]');if(a){e.preventDefault();if(state.busy){tell('Wait for the current save to finish.');return;}go(a.dataset.route);}});
window.addEventListener('hashchange',render);window.addEventListener('beforeunload',e=>{stopCamera();if(state.busy||state.pending.size){e.preventDefault();e.returnValue='';}});window.addEventListener('offline',()=>connection('Offline · saving unavailable'));
async function refreshConnection(){try{const health=await call('health');if(health.apiVersion!==4)throw new Error('Update the Apps Script backend to v4.');state.settings=health.settings;$('#setup-note').hidden=true;}catch(e){connection('Not connected');$('#setup-note').hidden=false;$('#setup-note').textContent=e.message;}}
$('#reconnect').onclick=refreshConnection;window.addEventListener('online',refreshConnection);
// No localStorage, sessionStorage, IndexedDB, service worker or offline mutation queue.
setInterval(()=>{if(document.visibilityState==='visible'&&!state.busy&&!state.pending.size){const p=route().path;if(p==='/home')refreshConnection();else if(p==='/store'&&!document.activeElement?.matches('input,textarea,select'))render();}},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stopCamera();else if(!state.busy&&route().path==='/home')refreshConnection();});
const logo=$('#brand-image');logo.addEventListener('error',()=>{if(!logo.dataset.fallback){logo.dataset.fallback='true';logo.src=window.REVIVE_LOGO_DATA;}});logo.src=window.REVIVE_CONFIG?.LOGO_URL||'./logo.png?v=4';
history.replaceState({depth:0},'',location.hash||'#/home');render();refreshConnection();
})();
</script></body></html>
